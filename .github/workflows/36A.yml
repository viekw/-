name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create Source Code
        run: |
          cat << 'EOF' > FixWKWebView.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <objc/runtime.h>

          // 1. 下移 UI 布局（保留原下移 40px 功能）
          static void adjustFrame(WKWebView *webView) {
              if (!webView || !webView.window) return;
              
              NSString *urlString = webView.URL.absoluteString.lowercaseString;
              NSString *title = webView.title;
              
              BOOL isTarget = (urlString && [urlString containsString:@"qyhx"]) ||
                              (title && [title containsString:@"湖北权益超市"]);
                              
              if (isTarget) {
                  CGRect frame = webView.frame;
                  if (frame.origin.y == 0) {
                      frame.origin.y = 40;
                      frame.size.height -= 40;
                      [webView setFrame:frame];
                  }
              }
          }

          __attribute__((constructor)) static void initFix() {
              Class cls = NSClassFromString(@"WKWebView");
              if (!cls) return;

              // Hook layoutSubviews 进行 UI 调整
              SEL layoutSel = @selector(layoutSubviews);
              Method layoutMethod = class_getInstanceMethod(cls, layoutSel);
              if (layoutMethod) {
                  IMP origImp = method_getImplementation(layoutMethod);
                  void (*origFunc)(id, SEL) = (void *)origImp;
                  
                  IMP newImp = imp_implementationWithBlock(^(id self) {
                      origFunc(self, layoutSel);
                      adjustFrame((WKWebView *)self);
                  });
                  method_setImplementation(layoutMethod, newImp);
              }

              // 2. Hook 页面加载，拦截首页发起的 401 错域请求，自动修正为独立 Cordova 打开
              SEL loadSel = @selector(loadRequest:);
              Method loadMethod = class_getInstanceMethod(cls, loadSel);
              if (loadMethod) {
                  IMP origLoadImp = method_getImplementation(loadMethod);
                  id (*origLoadFunc)(id, SEL, NSURLRequest *) = (id)origLoadImp;
                  
                  IMP newLoadImp = imp_implementationWithBlock(^(id self, NSURLRequest *request) {
                      WKWebView *webView = (WKWebView *)self;
                      NSString *urlStr = request.URL.absoluteString;
                      
                      // 检测到如果在首页的 MainViewController 尝试异步加载 qyhx 页面
                      if ([urlStr containsString:@"qyhx"] && [webView.URL.absoluteString containsString:@"xsmh.telecomhb.com"]) {
                          // 强制重定向请求直接跳转到目标真正的页面
                          NSURL *targetURL = [NSURL URLWithString:@"https://qypt.hb.189.cn/wap/#/qyhx"];
                          NSMutableURLRequest *newReq = [NSMutableURLRequest requestWithURL:targetURL];
                          return origLoadFunc(self, loadSel, newReq);
                      }
                      
                      return origLoadFunc(self, loadSel, request);
                  });
                  method_setImplementation(loadMethod, newLoadImp);
              }
          }
          EOF

      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
          -framework Foundation -framework UIKit -framework WebKit \
          FixWKWebView.m -o 36m.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 36m-dylib
          path: 36m.dylib
