name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create Source Code
        run: |
          cat << 'EOF' > FixWKWebView.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static void checkAndAdjustFrame(WKWebView *webView) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  NSString *urlString = webView.URL.absoluteString.lowercaseString;
                  NSString *title = webView.title;
                  
                  BOOL isTargetPage = (urlString && [urlString containsString:@"qyhx"]) || 
                                     (title && [title containsString:@"湖北权益超市"]);
                  
                  if (isTargetPage) {
                      CGRect frame = webView.frame;
                      // 只要还在顶部 0 的位置，就强行下移 40 并刷新布局
                      if (frame.origin.y == 0) {
                          frame.origin.y = 40;
                          [webView setFrame:frame];
                          [webView.superview setNeedsLayout];
                          [webView.superview layoutIfNeeded];
                      }
                  }
              });
          }

          __attribute__((constructor)) static void initFix() {
              Class cls = NSClassFromString(@"WKWebView");
              if (!cls) return;

              // 1. Hook setFrame: 确保设置位置时实时拦截
              SEL setFrameSel = @selector(setFrame:);
              Method setFrameMethod = class_getInstanceMethod(cls, setFrameSel);
              if (setFrameMethod) {
                  IMP origSetFrameImp = method_getImplementation(setFrameMethod);
                  void (*origSetFrame)(id, SEL, CGRect) = (void *)origSetFrameImp;
                  
                  IMP newSetFrameImp = imp_implementationWithBlock(^(id self, CGRect frame) {
                      origSetFrame(self, setFrameSel, frame);
                      checkAndAdjustFrame((WKWebView *)self);
                  });
                  method_setImplementation(setFrameMethod, newSetFrameImp);
              }

              // 2. Hook layoutSubviews: 确保布局绘制时拦截
              SEL layoutSel = @selector(layoutSubviews);
              Method layoutMethod = class_getInstanceMethod(cls, layoutSel);
              if (layoutMethod) {
                  IMP origLayoutImp = method_getImplementation(layoutMethod);
                  void (*origLayout)(id, SEL) = (void *)origLayoutImp;
                  
                  IMP newLayoutImp = imp_implementationWithBlock(^(id self) {
                      origLayout(self, layoutSel);
                      checkAndAdjustFrame((WKWebView *)self);
                  });
                  method_setImplementation(layoutMethod, newLayoutImp);
              }
          }
          EOF

      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
          -framework Foundation -framework UIKit -framework WebKit \
          FixWKWebView.m -o 36m.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 36m-dylib
          path: 36m.dylib
