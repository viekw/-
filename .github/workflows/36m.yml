name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create Source Code
        run: |
          cat << 'EOF' > FixWKWebView.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          // 核心调整函数
          static void adjustFrameIfTarget(WKWebView *webView, NSURL *url) {
              if (!webView) return;
              
              NSString *urlString = url.absoluteString.lowercaseString;
              NSString *title = webView.title.lowercaseString;
              
              BOOL isTargetPage = (urlString && [urlString containsString:@"qyhx"]) || 
                                 (title && [title containsString:@"湖北权益超市"]);
              
              if (isTargetPage) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      CGRect frame = webView.frame;
                      if (frame.origin.y == 0) {
                          frame.origin.y = 40;
                          [webView setFrame:frame];
                          [webView.superview setNeedsLayout];
                          [webView.superview layoutIfNeeded];
                      }
                  });
              }
          }

          __attribute__((constructor)) static void initFix() {
              Class cls = NSClassFromString(@"WKWebView");
              if (!cls) return;

              // 1. Hook loadRequest: (网页开始发起网络请求的第一时间触发)
              SEL loadSel = @selector(loadRequest:);
              Method loadMethod = class_getInstanceMethod(cls, loadSel);
              if (loadMethod) {
                  IMP origLoadImp = method_getImplementation(loadMethod);
                  id (*origLoad)(id, SEL, NSURLRequest *) = (id)origLoadImp;
                  
                  IMP newLoadImp = imp_implementationWithBlock(^(id self, NSURLRequest *request) {
                      if (request && request.URL) {
                          adjustFrameIfTarget((WKWebView *)self, request.URL);
                      }
                      return origLoad(self, loadSel, request);
                  });
                  method_setImplementation(loadMethod, newLoadImp);
              }

              // 2. 保留 layoutSubviews (作为备用兜底)
              SEL layoutSel = @selector(layoutSubviews);
              Method layoutMethod = class_getInstanceMethod(cls, layoutSel);
              if (layoutMethod) {
                  IMP origLayoutImp = method_getImplementation(layoutMethod);
                  void (*origLayout)(id, SEL) = (void *)origLayoutImp;
                  
                  IMP newLayoutImp = imp_implementationWithBlock(^(id self) {
                      origLayout(self, layoutSel);
                      WKWebView *webView = (WKWebView *)self;
                      adjustFrameIfTarget(webView, webView.URL);
                  });
                  method_setImplementation(layoutMethod, newLayoutImp);
              }
          }
          EOF

      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
          -framework Foundation -framework UIKit -framework WebKit \
          FixWKWebView.m -o 36m.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 36m-dylib
          path: 36m.dylib
