name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create Source Code
        run: |
          cat << 'EOF' > FixWKWebView.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <objc/runtime.h>

          static void adjustFrame(WKWebView *webView) {
              if (!webView || !webView.window) return;
              
              NSString *urlString = webView.URL.absoluteString.lowercaseString;
              NSString *title = webView.title;
              
              BOOL isTarget = (urlString && [urlString containsString:@"qyhx"]) ||
                              (title && [title containsString:@"湖北权益超市"]);
                              
              if (isTarget) {
                  // 下移 WKWebView 自身
                  CGRect frame = webView.frame;
                  if (frame.origin.y == 0) {
                      frame.origin.y = 40;
                      frame.size.height -= 40; // 适当缩减高度防止底部超屏
                      [webView setFrame:frame];
                  }
              }
          }

          __attribute__((constructor)) static void initFix() {
              Class cls = NSClassFromString(@"WKWebView");
              if (!cls) return;

              // 1. Hook layoutSubviews（界面重绘时自动下移）
              SEL layoutSel = @selector(layoutSubviews);
              Method layoutMethod = class_getInstanceMethod(cls, layoutSel);
              if (layoutMethod) {
                  IMP origImp = method_getImplementation(layoutMethod);
                  void (*origFunc)(id, SEL) = (void *)origImp;
                  
                  IMP newImp = imp_implementationWithBlock(^(id self) {
                      origFunc(self, layoutSel);
                      adjustFrame((WKWebView *)self);
                  });
                  method_setImplementation(layoutMethod, newImp);
              }

              // 2. Hook didMoveToWindow（刚加载进屏幕时，延迟 0.3 秒自动下移一次，解决无须切后台问题）
              SEL didMoveSel = @selector(didMoveToWindow);
              Method didMoveMethod = class_getInstanceMethod(cls, didMoveSel);
              if (didMoveMethod) {
                  IMP origDidMoveImp = method_getImplementation(didMoveMethod);
                  void (*origDidMoveFunc)(id, SEL) = (void *)origDidMoveImp;
                  
                  IMP newDidMoveImp = imp_implementationWithBlock(^(id self) {
                      origDidMoveFunc(self, didMoveSel);
                      
                      WKWebView *webView = (WKWebView *)self;
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.3 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          adjustFrame(webView);
                      });
                  });
                  method_setImplementation(didMoveMethod, newDidMoveImp);
              }
          }
          EOF

      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
          -framework Foundation -framework UIKit -framework WebKit \
          FixWKWebView.m -o 36m.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 36m-dylib
          path: 36m.dylib
