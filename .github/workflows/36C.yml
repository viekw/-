name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create Source Code
        run: |
          cat << 'EOF' > FixWKWebView.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static void adjustWebView(WKWebView *webView) {
              if (!webView) return;
              
              NSString *urlString = webView.URL.absoluteString.lowercaseString;
              NSString *title = webView.title;
              
              BOOL isTarget = (urlString && [urlString containsString:@"qyhx"]) ||
                              (title && [title containsString:@"湖北权益超市"]);
                              
              if (isTarget) {
                  CGRect frame = webView.frame;
                  if (frame.origin.y == 0) {
                      frame.origin.y = 40;
                      [webView setFrame:frame];
                      [webView setNeedsLayout];
                      [webView layoutIfNeeded];
                      
                      // 同时也尝试修改父视图的 layout
                      if (webView.superview) {
                          [webView.superview setNeedsLayout];
                          [webView.superview layoutIfNeeded];
                      }
                  }
              }
          }

          __attribute__((constructor)) static void initFix() {
              Class cls = NSClassFromString(@"WKWebView");
              if (!cls) return;

              // Hook didMoveToWindow: 当 WebView 被放到屏幕上时触发
              SEL didMoveSel = @selector(didMoveToWindow);
              Method didMoveMethod = class_getInstanceMethod(cls, didMoveSel);
              if (didMoveMethod) {
                  IMP origImp = method_getImplementation(didMoveMethod);
                  void (*origFunc)(id, SEL) = (void *)origImp;
                  
                  IMP newImp = imp_implementationWithBlock(^(id self) {
                      origFunc(self, didMoveSel);
                      
                      WKWebView *webView = (WKWebView *)self;
                      if (webView.window) {
                          // 开启一个轮询：连续检测 5 次（每 0.4 秒一次），覆盖 H5 异步加载的时间段
                          for (int i = 1; i <= 5; i++) {
                              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(i * 0.4 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                                  adjustWebView(webView);
                              });
                          }
                      }
                  });
                  method_setImplementation(didMoveMethod, newImp);
              }
          }
          EOF

      - name: Compile
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
          -framework Foundation -framework UIKit -framework WebKit \
          FixWKWebView.m -o 36m.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 36m-dylib
          path: 36m.dylib
